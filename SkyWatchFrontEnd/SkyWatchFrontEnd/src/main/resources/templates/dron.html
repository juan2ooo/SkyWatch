<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyWatch - Panel Dron</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .navbar-brand {
            font-weight: bold;
            color: #0d6efd !important;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="#">SkyWatch</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/home">Validador</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/dron">Panel Dron</a>
                </li>
            </ul>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button class="btn btn-outline-danger btn-sm" type="submit">Cerrar Sesión</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card p-4">
                <h2 class="mb-4 text-center">Registrar Actividad Dron</h2>
                
                <div class="mb-3">
                    <label for="idRuta" class="form-label">ID de la Ruta</label>
                    <input type="number" class="form-control" id="idRuta" placeholder="Ej: 123">
                </div>
                
                <div class="mb-3">
                    <label for="idDron" class="form-label">ID del Dron</label>
                    <input type="number" class="form-control" id="idDron" placeholder="Ej: 45">
                </div>
                
                <div class="mb-3">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="email" placeholder="nombre@ejemplo.com">
                </div>
                
                <div class="mb-4">
                    <label for="foto" class="form-label">Evidencia Fotográfica</label>
                    <input type="file" class="form-control" id="foto">
                </div>

                <div class="d-grid">
                    <button class="btn btn-primary btn-lg" onclick="enviar()">Enviar Reporte</button>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="text-center py-4 text-muted">
    &copy; 2026 SkyWatch Drone Systems
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    async function enviar() {
        try {
            console.log("Iniciando envío...");

            const archivo = document.getElementById("foto").files[0];
            if (!archivo) {
                alert("Por favor, selecciona una foto.");
                return;
            }

            console.log("Archivo seleccionado:", archivo);

            const imageBase64 = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const base64 = reader.result.split(",")[1];
                    console.log("Imagen en base64 generada");
                    resolve(base64);
                };
                reader.onerror = (err) => reject(err);
                reader.readAsDataURL(archivo);
            });

            const mensaje = {
                idRuta: Number(document.getElementById("idRuta").value),
                idDron: Number(document.getElementById("idDron").value),
                email: document.getElementById("email").value,
                foto: imageBase64
            };

            console.log("Mensaje a enviar:", mensaje);

            const response = await fetch("http://localhost:8085/api/cola/delete", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(mensaje)
            });

            console.log("Status:", response.status);

            const text = await response.text();
            console.log("Respuesta del servidor:", text);

            alert("Reporte enviado con éxito");
        } catch (error) {
            console.error("Error en la petición:", error);
            alert("Error al enviar el reporte: " + error);
        }
    }
</script>

</body>
</html>
