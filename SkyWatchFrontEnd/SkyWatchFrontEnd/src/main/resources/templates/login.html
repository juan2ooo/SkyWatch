<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyWatch - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            background-color: white;
        }
        .brand-logo {
            text-align: center;
            margin-bottom: 2rem;
            color: #0d6efd;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand-logo">
        <h2 class="fw-bold">SkyWatch</h2>
        <p class="text-muted">Inicia sesión para continuar</p>
    </div>

    <!-- Formulario -->
    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" name="username" class="form-control" placeholder="Tu usuario" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required/>
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">Entrar</button>
        </div>
    </form>

    <!-- Mensaje de error -->
    <div th:if="${param.error}" class="alert alert-danger mt-3" role="alert">
        Usuario o contraseña incorrectos
    </div>

    <!-- Mensaje de logout -->
    <div th:if="${param.logout}" class="alert alert-info mt-3" role="alert">
        Has cerrado sesión
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
