<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyWatch - Drone Flight Validator</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
        body {
            background-color: #f8f9fa;
        }
        #map {
            height: 500px;
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 1.5rem;
        }
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .navbar-brand {
            font-weight: bold;
            color: #0d6efd !important;
        }
        #result {
            font-weight: 500;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="#">SkyWatch</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="/home">Validador</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/dron">Panel Dron</a>
                </li>
            </ul>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button class="btn btn-outline-danger btn-sm" type="submit">Cerrar Sesión</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row">
        <div class="col-12">
            <div class="card p-4 mb-4">
                <h2 class="mb-4">Validar Vuelo de Dron</h2>
                
                <div id="map"></div>

                <div class="d-flex align-items-center justify-content-between">
                    <div id="result" class="alert alert-info mb-0 py-2">
                        Selecciona 2 puntos en el mapa para comenzar
                    </div>
                    <button class="btn btn-primary btn-lg" onclick="validateFlight()">
                        Validar Vuelo
                    </button>
                </div>
            </div>
        </div>

        <div class="col-12">
            <div class="card p-4">
                <h4 class="mb-3">Historial de Rutas</h4>
                <div class="table-responsive">
                    <table id="tablaRutas" class="table table-striped table-hover">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Estado</th>
                            <th>Inicio Lon</th>
                            <th>Inicio Lat</th>
                            <th>Fin Lon</th>
                            <th>Fin Lat</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="ruta : ${rutas}">
                            <td th:text="${ruta.id}"></td>
                            <td>
                                <span th:text="${ruta.status}" 
                                      th:classappend="${ruta.status == 'OK' ? 'badge bg-success' : 'badge bg-warning text-dark'}">
                                </span>
                            </td>
                            <td th:text="${#numbers.formatDecimal(ruta.startLon,1,6)}"></td>
                            <td th:text="${#numbers.formatDecimal(ruta.startLat,1,6)}"></td>
                            <td th:text="${#numbers.formatDecimal(ruta.endLon,1,6)}"></td>
                            <td th:text="${#numbers.formatDecimal(ruta.endLat,1,6)}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="text-center py-4 text-muted">
    &copy; 2026 SkyWatch Drone Systems
</footer>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="/consumoApi.js"></script>

<script>
    $(document).ready(function() {
        $('#tablaRutas').DataTable({
            language: {
                url: '//cdn.datatables.net/plug-ins/1.13.8/i18n/es-ES.json'
            }
        });
    });
</script>

</body>
</html>
